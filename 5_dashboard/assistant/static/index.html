<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SK Hynix RAG 어시스턴트</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 860px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #1e293b;
    }

    /* 헤더 */
    .header {
      padding: 16px 24px;
      background: linear-gradient(135deg, #1d4ed8, #0e7490);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .header-icon { font-size: 28px; }
    .header-text h1 { font-size: 17px; font-weight: 700; color: #fff; }
    .header-text p  { font-size: 12px; color: #bae6fd; margin-top: 2px; }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #4ade80;
      margin-left: auto;
      box-shadow: 0 0 6px #4ade80;
    }
    .status-dot.offline { background: #f87171; box-shadow: 0 0 6px #f87171; }

    /* 빠른 질문 */
    .quick-btns {
      padding: 10px 16px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      flex-shrink: 0;
    }
    .quick-btn {
      padding: 5px 12px;
      font-size: 12px;
      background: #1d4ed820;
      border: 1px solid #3b82f6;
      border-radius: 20px;
      color: #93c5fd;
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }
    .quick-btn:hover { background: #1d4ed840; color: #fff; }

    /* 메시지 영역 */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

    .msg { display: flex; gap: 10px; max-width: 85%; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.bot  { align-self: flex-start; }

    .avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .bot  .avatar { background: #1d4ed8; }
    .user .avatar { background: #0e7490; }

    .bubble {
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.6;
    }
    .bot  .bubble {
      background: #273347;
      border-bottom-left-radius: 4px;
      color: #e2e8f0;
    }
    .user .bubble {
      background: #1d4ed8;
      border-bottom-right-radius: 4px;
      color: #fff;
    }
    .bubble.error { background: #450a0a; border: 1px solid #7f1d1d; }

    /* 마크다운 스타일 */
    .bubble h1, .bubble h2, .bubble h3 {
      font-size: 14px; font-weight: 700;
      margin: 8px 0 4px; color: #93c5fd;
    }
    .bubble p   { margin: 4px 0; }
    .bubble ul, .bubble ol { padding-left: 18px; margin: 4px 0; }
    .bubble li  { margin: 2px 0; }
    .bubble code {
      background: #0f172a; padding: 1px 5px;
      border-radius: 4px; font-family: monospace; font-size: 13px;
      color: #34d399;
    }
    .bubble pre {
      background: #0f172a; padding: 10px;
      border-radius: 8px; overflow-x: auto;
      margin: 6px 0;
    }
    .bubble pre code { background: none; padding: 0; color: #a3e635; }
    .bubble strong { color: #fbbf24; }
    .bubble blockquote {
      border-left: 3px solid #3b82f6;
      padding-left: 10px; color: #94a3b8;
      margin: 4px 0;
    }

    /* 타이핑 인디케이터 */
    .typing { display: flex; gap: 5px; padding: 6px 0; align-items: center; }
    .typing span {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #60a5fa;
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: .6; }
      30% { transform: translateY(-7px); opacity: 1; }
    }

    /* 입력 영역 */
    .input-row {
      display: flex;
      gap: 10px;
      padding: 12px 16px;
      background: #1e293b;
      border-top: 1px solid #334155;
      flex-shrink: 0;
    }
    .input-row textarea {
      flex: 1;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      color: #e2e8f0;
      padding: 10px 14px;
      font-size: 14px;
      resize: none;
      outline: none;
      transition: border-color .15s;
      font-family: inherit;
      line-height: 1.5;
    }
    .input-row textarea:focus { border-color: #3b82f6; }
    .input-row textarea::placeholder { color: #475569; }
    .send-btn {
      padding: 0 20px;
      background: #1d4ed8;
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
      white-space: nowrap;
    }
    .send-btn:hover:not(:disabled) { background: #2563eb; }
    .send-btn:disabled { background: #334155; color: #64748b; cursor: default; }

    /* RAG 출처 뱃지 */
    .rag-badge {
      font-size: 11px;
      color: #64748b;
      margin-top: 5px;
      padding-left: 2px;
    }
  </style>
</head>
<body>
<div class="container">
  <!-- 헤더 -->
  <div class="header">
    <div class="header-icon">🧠</div>
    <div class="header-text">
      <h1>SK Hynix RAG 어시스턴트</h1>
      <p>DRAM · Wafer Test · 머신러닝 개념 Q&A</p>
    </div>
    <div class="status-dot" id="statusDot"></div>
  </div>

  <!-- 빠른 질문 -->
  <div class="quick-btns" id="quickBtns">
    <button class="quick-btn" onclick="quickSend(this)">SNC가 뭐야?</button>
    <button class="quick-btn" onclick="quickSend(this)">BWL이란?</button>
    <button class="quick-btn" onclick="quickSend(this)">DRAM refresh 설명해줘</button>
    <button class="quick-btn" onclick="quickSend(this)">HBM과 DDR 차이는?</button>
    <button class="quick-btn" onclick="quickSend(this)">Two-Stage 모델이란?</button>
    <button class="quick-btn" onclick="quickSend(this)">Zero-inflated 분포란?</button>
    <button class="quick-btn" onclick="quickSend(this)">wafer 수율 개선 방법은?</button>
  </div>

  <!-- 메시지 목록 -->
  <div class="messages" id="messages">
    <div class="msg bot">
      <div class="avatar">🤖</div>
      <div class="bubble">
        안녕하세요! SK Hynix Wafer Test 도메인 전문 어시스턴트입니다.<br>
        반도체, DRAM, 공정, 머신러닝 관련 질문을 해주세요.<br><br>
        RAG DB에서 관련 문서를 검색해 정확한 답변을 드립니다.
      </div>
    </div>
  </div>

  <!-- 입력창 -->
  <div class="input-row">
    <textarea id="inputBox" rows="2" placeholder="질문을 입력하세요… (Enter 전송, Shift+Enter 줄바꿈)"></textarea>
    <button class="send-btn" id="sendBtn" onclick="send()">전송</button>
  </div>
</div>

<script>
  const API = 'http://localhost:8002';
  let history = [];
  let loading = false;

  const msgEl   = document.getElementById('messages');
  const inputEl = document.getElementById('inputBox');
  const sendEl  = document.getElementById('sendBtn');
  const statusDot = document.getElementById('statusDot');

  // 서버 상태 확인
  async function checkHealth() {
    try {
      const r = await fetch(`${API}/health`, { signal: AbortSignal.timeout(3000) });
      if (r.ok) {
        statusDot.classList.remove('offline');
      } else {
        statusDot.classList.add('offline');
      }
    } catch {
      statusDot.classList.add('offline');
    }
  }
  checkHealth();
  setInterval(checkHealth, 30000);

  function scrollToBottom() {
    msgEl.scrollTop = msgEl.scrollHeight;
  }

  function appendMsg(role, html, isMarkdown = false) {
    const wrap = document.createElement('div');
    wrap.className = `msg ${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'bot' ? '🤖' : '👤';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (isMarkdown) {
      bubble.innerHTML = marked.parse(html);
    } else {
      bubble.textContent = html;
    }

    wrap.appendChild(avatar);
    wrap.appendChild(bubble);
    msgEl.appendChild(wrap);
    scrollToBottom();
    return bubble;
  }

  function showTyping() {
    const wrap = document.createElement('div');
    wrap.className = 'msg bot';
    wrap.id = 'typing';

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = '🤖';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';

    wrap.appendChild(avatar);
    wrap.appendChild(bubble);
    msgEl.appendChild(wrap);
    scrollToBottom();
  }

  function removeTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  function setLoading(val) {
    loading = val;
    sendEl.disabled = val;
    inputEl.disabled = val;
  }

  async function send() {
    const text = inputEl.value.trim();
    if (!text || loading) return;

    inputEl.value = '';
    appendMsg('user', text, false);
    showTyping();
    setLoading(true);

    try {
      const res = await fetch(`${API}/chat/assistant`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, history }),
      });

      removeTyping();

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `HTTP ${res.status}`);
      }

      const data = await res.json();
      history = data.history;
      appendMsg('bot', data.response, true);
    } catch (e) {
      removeTyping();
      const b = appendMsg('bot', `⚠️ 오류: ${e.message}`, false);
      b.classList.add('error');
    } finally {
      setLoading(false);
      scrollToBottom();
    }
  }

  function quickSend(btn) {
    if (loading) return;
    inputEl.value = btn.textContent;
    send();
  }

  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });
</script>
</body>
</html>
